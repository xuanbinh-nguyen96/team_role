<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Role Insight Assessment</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen">

<div class="max-w-6xl mx-auto p-4">
  <div class="bg-gradient-to-r from-indigo-600 to-cyan-600 text-white rounded-3xl p-6 shadow-lg">
    <h1 class="text-3xl font-bold">Team Role Insight Assessment</h1>
    <p class="mt-3 text-white/90">
      Phiên bản chạy trực tiếp trên GitHub Pages — không cần React build.
    </p>
  </div>

  <div class="bg-white rounded-3xl shadow mt-6 p-5">
    <h2 class="text-xl font-bold mb-4">Thông tin học viên</h2>

    <div class="grid md:grid-cols-2 gap-3">
      <input id="name" class="border rounded-xl p-3" placeholder="Họ tên">
      <input id="employeeId" class="border rounded-xl p-3" placeholder="Mã nhân viên">
    </div>
  </div>

  <div id="questions" class="mt-6 space-y-4"></div>

  <div class="bg-white rounded-3xl shadow mt-6 p-5">
    <div class="flex gap-3 flex-wrap">
      <button onclick="calculateResults()" class="bg-indigo-600 text-white px-5 py-3 rounded-2xl">
        Xem kết quả
      </button>

      <button onclick="saveData()" class="border px-5 py-3 rounded-2xl">
        Lưu localStorage
      </button>

      <button onclick="resetForm()" class="border px-5 py-3 rounded-2xl">
        Làm mới
      </button>
    </div>
  </div>

  <div id="results" class="mt-6 hidden">
    <div class="bg-white rounded-3xl shadow p-5">
      <h2 class="text-2xl font-bold mb-4">Kết quả</h2>

      <div id="topRoles" class="grid md:grid-cols-3 gap-4"></div>

      <div class="mt-8">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const roles = {
  PL: "Plant",
  RI: "Resource Investigator",
  CO: "Coordinator",
  SH: "Shaper",
  ME: "Monitor Evaluator",
  TW: "Teamworker",
  IMP: "Implementer",
  CF: "Completer Finisher",
  SP: "Specialist"
};

const questions = [
  { id: 1, role: "PL", text: "Khi dự án gặp bế tắc, tôi thường nghĩ ra hướng tiếp cận mới." },
  { id: 2, role: "RI", text: "Tôi chủ động tìm nguồn lực hoặc cơ hội bên ngoài." },
  { id: 3, role: "CO", text: "Tôi thường giúp nhóm làm rõ mục tiêu." },
  { id: 4, role: "SH", text: "Tôi thúc đẩy tiến độ khi nhóm chậm." },
  { id: 5, role: "ME", text: "Tôi cân nhắc rủi ro trước khi quyết định." },
  { id: 6, role: "TW", text: "Tôi chú ý đến cảm xúc và sự phối hợp." },
  { id: 7, role: "IMP", text: "Tôi thích biến kế hoạch thành hành động." },
  { id: 8, role: "CF", text: "Tôi thường phát hiện lỗi nhỏ." },
  { id: 9, role: "SP", text: "Tôi thích đào sâu chuyên môn." }
];

const answers = {};

function renderQuestions() {
  const container = document.getElementById("questions");

  questions.forEach(q => {
    const div = document.createElement("div");

    div.className = "bg-white rounded-3xl shadow p-5";

    div.innerHTML = `
      <div class="font-semibold mb-4">${q.id}. ${q.text}</div>

      <div class="grid grid-cols-5 gap-2">
        ${[1,2,3,4,5].map(v => `
          <button
            class="border rounded-xl py-3 hover:bg-slate-100"
            onclick="setAnswer(${q.id}, ${v}, this)"
          >
            ${v}
          </button>
        `).join("")}
      </div>
    `;

    container.appendChild(div);
  });
}

function setAnswer(id, value, btn) {
  answers[id] = value;

  const parent = btn.parentElement;
  [...parent.children].forEach(el => {
    el.classList.remove("bg-black", "text-white");
  });

  btn.classList.add("bg-black", "text-white");
}

function calculateResults() {
  const totals = {};

  Object.keys(roles).forEach(r => {
    totals[r] = { total: 0, count: 0 };
  });

  questions.forEach(q => {
    const val = answers[q.id] || 0;
    totals[q.role].total += val;
    totals[q.role].count += 1;
  });

  const resultArray = Object.keys(totals).map(key => {
    const avg = totals[key].total / totals[key].count;
    const score = Math.round((avg / 5) * 100);

    return {
      role: key,
      name: roles[key],
      score
    };
  });

  resultArray.sort((a,b) => b.score - a.score);

  const top = resultArray.slice(0,3);

  const topContainer = document.getElementById("topRoles");

  topContainer.innerHTML = top.map((r, i) => `
    <div class="border rounded-2xl p-4">
      <div class="text-sm text-slate-500">Top ${i+1}</div>
      <div class="font-bold text-lg mt-1">${r.name}</div>
      <div class="text-3xl font-bold text-indigo-600 mt-2">${r.score}%</div>
    </div>
  `).join("");

  document.getElementById("results").classList.remove("hidden");

  renderChart(resultArray);
}

let chart;

function renderChart(data) {
  const ctx = document.getElementById('chart');

  if (chart) {
    chart.destroy();
  }

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.role),
      datasets: [{
        label: 'Score',
        data: data.map(d => d.score)
      }]
    },
    options: {
      responsive: true
    }
  });
}

function saveData() {
  const payload = {
    name: document.getElementById("name").value,
    employeeId: document.getElementById("employeeId").value,
    answers
  };

  localStorage.setItem("team-role-data", JSON.stringify(payload));

  alert("Đã lưu localStorage");
}

function resetForm() {
  localStorage.removeItem("team-role-data");
  location.reload();
}

function loadData() {
  const raw = localStorage.getItem("team-role-data");

  if (!raw) return;

  const data = JSON.parse(raw);

  document.getElementById("name").value = data.name || "";
  document.getElementById("employeeId").value = data.employeeId || "";

  Object.assign(answers, data.answers || {});
}

renderQuestions();
loadData();
</script>

</body>
</html>
